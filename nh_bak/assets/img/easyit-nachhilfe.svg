      <path d="M209 127c33-37 103-46 151-11l-63 18-38 32-61-3z" fill="#f7c600"/>
      <path d="M214 131c-40 8-68 39-63 71 6 38 50 52 87 32l47-25-7-53-64-25z" fill="url(#gold)" stroke="#082c63" stroke-width="16"/>
