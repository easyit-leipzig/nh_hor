<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">easyIT Nachhilfe Leipzig</title>
  <desc id="desc">Vektorlogo mit Leipziger Löwen, versetztem Gehirn und dem Schriftzug easyIT Nachhilfe in Leipziger Wappenfarben.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff06a"/><stop offset="0.45" stop-color="#f7c600"/><stop offset="1" stop-color="#d89500"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1677c8"/><stop offset="1" stop-color="#003f86"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a3d"/><stop offset="1" stop-color="#c51620"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#062650" flood-opacity=".24"/>
    </filter>
  </defs>

