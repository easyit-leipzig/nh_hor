      <path d="M420 190c82-67 128 27 79 78" fill="none" stroke="url(#gold)" stroke-width="17" stroke-linecap="round"/>
      <path d="M473 297c39 8 65 31 76 68-37-9-66 7-81 43-18-37-12-75 5-111z" fill="url(#gold)" stroke="#082c63" stroke-width="13"/>

