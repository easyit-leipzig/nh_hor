  <!-- Wortmarke -->
  <g transform="translate(382 610)">
    <text x="0" y="0" font-family="Trebuchet MS, Arial, sans-serif" font-size="205" font-style="italic" font-weight="900" letter-spacing="-15" fill="url(#blue)" stroke="#082c63" stroke-width="3">easyIT</text>
    <path d="M15 42c170 30 390 23 660-17" fill="none" stroke="#0057a4" stroke-width="15" stroke-linecap="round"/>
    <text x="175" y="155" font-family="Trebuchet MS, Arial, sans-serif" font-size="94" font-style="italic" font-weight="900" fill="url(#gold)" stroke="#b57900" stroke-width="2">Nachhilfe</text>
  </g>
</svg>
