      <path d="M254 150c17-13 41-12 57 3-19 15-39 14-57-3z" fill="#082c63"/>
      <circle cx="286" cy="153" r="6" fill="#fff"/>
      <path d="M192 214c27 23 59 19 84-4" fill="none" stroke="#082c63" stroke-width="12"/>

