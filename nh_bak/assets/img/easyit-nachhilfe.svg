      <path d="M161 25c41-22 95 3 101 50 39 7 62 47 44 83 28 32 16 82-24 98-2 44-45 74-87 59-28 32-78 31-104-3-42 7-79-26-77-68-35-25-35-78-2-105-13-42 18-84 61-88 17-31 54-43 88-26z" fill="url(#gold)" stroke="#082c63" stroke-width="16"/>
      <g fill="none" stroke="#0a4f98" stroke-width="11" stroke-linecap="round">
        <path d="M54 82c31-21 68-5 72 27-29-6-48 11-48 35"/><path d="M45 166c30-19 68-5 74 27"/><path d="M78 245c19-29 56-31 78-8"/>
      </g>
