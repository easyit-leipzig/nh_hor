      <path d="M219 57l-9-49 45 31 25-48 27 48 44-31-7 49z" fill="url(#red)" stroke="#082c63" stroke-width="13" stroke-linejoin="round"/>
      <rect x="218" y="51" width="128" height="25" rx="8" fill="#d71920" stroke="#082c63" stroke-width="11"/>
