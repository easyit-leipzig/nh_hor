<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Anmelden</title>
  <desc id="desc">Farbiges dreidimensionales Anmelde-Symbol mit Benutzer, Tür und Richtungspfeil</desc>
  <defs>
    <linearGradient id="bg" x1="16" y1="10" x2="114" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33a4f4"/>
      <stop offset="0.5" stop-color="#0963b5"/>
      <stop offset="1" stop-color="#022f62"/>
    </linearGradient>
    <linearGradient id="door" x1="60" y1="24" x2="103" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff39b"/>
      <stop offset="0.4" stop-color="#ffd32f"/>
      <stop offset="1" stop-color="#e58900"/>
    </linearGradient>
    <linearGradient id="person" x1="26" y1="30" x2="65" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#bfe7ff"/>
      <stop offset="1" stop-color="#56a8dc"/>
    </linearGradient>
    <linearGradient id="arrow" x1="50" y1="60" x2="101" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff799"/>
      <stop offset="0.45" stop-color="#ffd11f"/>
      <stop offset="1" stop-color="#e88700"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="190%" height="190%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#00152d" flood-opacity=".68"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#00264f" flood-opacity=".55"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="10" y="8" width="108" height="108" rx="28" fill="url(#bg)" stroke="#7ed0ff" stroke-width="3"/>
    <path d="M23 29c16-14 59-20 83-3" fill="none" stroke="#fff" stroke-opacity=".36" stroke-width="7" stroke-linecap="round"/>
    <path d="M21 93c25 16 67 16 88-7" fill="none" stroke="#001f45" stroke-opacity=".48" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M73 26h26a7 7 0 0 1 7 7v69a7 7 0 0 1-7 7H73Z" fill="#073e76" stroke="#b6e6ff" stroke-width="3"/>
    <path d="M72 28 98 34v66l-26 7Z" fill="url(#door)" stroke="#fff2a3" stroke-width="2.5"/>
    <ellipse cx="92" cy="68" rx="3.5" ry="4.5" fill="#815000"/>
    <path d="M76 34 95 38" stroke="#fff" stroke-opacity=".58" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g filter="url(#soft)">
    <circle cx="42" cy="42" r="14" fill="url(#person)" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M21 91c1-21 10-32 21-32s20 11 21 32Z" fill="url(#person)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M31 38c5-5 17-7 24 1" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M48 68h30V57l24 17-24 18V81H48Z" fill="url(#arrow)" stroke="#9d5a00" stroke-width="3" stroke-linejoin="round"/>
    <path d="M55 71h30" stroke="#fff9b0" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
